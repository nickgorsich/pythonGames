Example code for button functions

<body>
  <p>What are French fries made out of?</p>
  <input type="text" id="input1"><br>
  <button onclick="readInput();">Click</button><br>
  <p id="status">Click the button to submit answer</p>
<script>
  function readInput(){
    input1 = document.getElementById('input1');
    var paragraph = document.getElementById('status');
    //console.log(input1.value);
    if (input1.value == 'potatos'){
      paragraph.innerHTML = 'Correct!';
    }
    else{paragraph.innerHTML = 'incorrect, try again';}
  }
  
</script>
</body>
